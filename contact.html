<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Pareshani</title>
  <link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="app-shell">
    <div class="wrap" style="max-width:560px">
      <h1 class="page-title">Contact</h1>
      <p class="page-sub">Sawal, safety report, ya feedback bhejein.</p>
      <form class="panel" id="form">
        <div class="alert" id="alert" hidden></div>
        <div class="form-group"><label for="name">Name</label><input id="name" required minlength="2" /></div>
        <div class="form-group"><label for="email">Email</label><input id="email" type="email" required /></div>
        <div class="form-group"><label for="message">Message</label><textarea id="message" required minlength="10" maxlength="2000"></textarea></div>
        <button class="btn btn-primary btn-block">Send</button>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    import { bootPage, qs, setAlert } from "./js/app.js";
    import { getClient, friendlyError } from "./js/supabase.js";
    import { getAuth } from "./js/auth.js";
    await bootPage();
    qs("#form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const sb = getClient();
      if (!sb) return setAlert(qs("#alert"), "error", "Contact form database connect hone ke baad kaam karega.");
      const { error } = await sb.from("contact_messages").insert({
        name: qs("#name").value.trim(),
        email: qs("#email").value.trim(),
        message: qs("#message").value.trim(),
        user_id: getAuth().session?.user?.id || null,
      });
      if (error) setAlert(qs("#alert"), "error", friendlyError(error));
      else {
        setAlert(qs("#alert"), "ok", "Message mil gaya. Shukriya.");
        qs("#form").reset();
      }
    });
  </script>
</body>
</html>
